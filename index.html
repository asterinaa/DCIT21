<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVSU MARKET - Register & Log In</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-box">
            <h1 class="auth-title">CVSU MARKET</h1>
            <p class="auth-subtitle">Cavite State University - Main Campus Marketplace</p>

            <form id="authForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="userName" placeholder="e.g., Hanaiah Blaise Mendoza" required>
                </div>

                <div class="form-group">
                    <label>CvSU Email Address</label>
                    <input type="email" id="userEmail" placeholder="name@cvsu.edu.ph" required>
                </div>

                <div class="form-group">
                    <label>Select User Role</label>
                    <select id="userRole">
                        <option>CVSU Student (Buyer)</option>
                        <option>CVSU Student Entrepreneur (Vendor)</option>
                        <option>CVSU Faculty / Campus Staff</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>What are you going to do?</label>
                    <select id="userAction">
                        <option value="Buy">Buy Products / Services</option>
                        <option value="Sell">Sell Products / Services</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Select Category</label>
                    <select id="userCategory">
                        <option value="All">All Categories</option>
                        <option value="Food & Beverages">Food & Beverages</option>
                        <option value="Customized Items">Customized Items</option>
                        <option value="Campus Services">Campus Services</option>
                        <option value="Pre-Loved Goods">Pre-Loved Goods</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="userPass" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="view-more-btn" style="margin-top: 20px;">Register & Enter Market</button>
            </form>
        </div>
    </div>

    <footer>
        <h3>CVSU MARKET — DCIT 21: Introduction to Computing</h3>
        <p>Bachelor of Science in Information Technology | Cavite State University - Main</p>
        <p><strong>Group Members:</strong> Erin Beatrice Espineli &bull; Hanaiah Blaise Mendoza &bull; Denise Kim Reyes</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
